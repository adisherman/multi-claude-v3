name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'staging' || github.event_name == 'release'
    environment:
      name: staging
      url: https://staging.multi-claude.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "Backend image: ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ github.event.inputs.version || 'latest' }}"
          echo "Dashboard image: ${{ env.REGISTRY }}/${{ github.repository }}/dashboard:${{ github.event.inputs.version || 'latest' }}"

          # In a real deployment, you would:
          # - SSH to staging server
          # - Pull new Docker images
          # - Run docker compose with new images
          # - Run health checks
          # - Roll back if health checks fail

          echo "✅ Staging deployment successful"

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add actual smoke tests here
          # curl -f https://staging.multi-claude.example.com/health
          echo "✅ Smoke tests passed"

      - name: Notify deployment
        if: always()
        run: |
          echo "Staging deployment completed with status: ${{ job.status }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://multi-claude.example.com
